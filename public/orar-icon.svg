<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <linearGradient id="orar-bg" x1="48" y1="32" x2="464" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="55%" stop-color="#171936" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="orar-border" x1="24" y1="24" x2="488" y2="488" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="layer-top" x1="88" y1="100" x2="424" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="layer-mid" x1="88" y1="200" x2="424" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="layer-bot" x1="88" y1="300" x2="424" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="strap-metal" x1="256" y1="84" x2="256" y2="428" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="35%" stop-color="#94a3b8" />
      <stop offset="70%" stop-color="#475569" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="o-glow" x1="200" y1="200" x2="312" y2="312" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#orar-bg)" stroke="url(#orar-border)" stroke-width="12" />

  <!-- Subtle inner rim -->
  <rect x="38" y="38" width="436" height="436" rx="96" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3" />

  <!-- Bottom Archive Layer (Emerald) -->
  <rect x="86" y="316" width="340" height="84" rx="22" fill="url(#layer-bot)" />
  <rect x="86" y="316" width="340" height="16" rx="8" fill="#ffffff" fill-opacity="0.18" />
  <rect x="112" y="352" width="76" height="10" rx="5" fill="#064e3b" fill-opacity="0.45" />
  <rect x="324" y="352" width="76" height="10" rx="5" fill="#064e3b" fill-opacity="0.45" />

  <!-- Middle Archive Layer (Indigo) -->
  <rect x="86" y="214" width="340" height="84" rx="22" fill="url(#layer-mid)" />
  <rect x="86" y="214" width="340" height="16" rx="8" fill="#ffffff" fill-opacity="0.18" />
  <rect x="112" y="250" width="76" height="10" rx="5" fill="#1e1b4b" fill-opacity="0.45" />
  <rect x="324" y="250" width="76" height="10" rx="5" fill="#1e1b4b" fill-opacity="0.45" />

  <!-- Top Archive Layer (Amber) -->
  <rect x="86" y="112" width="340" height="84" rx="22" fill="url(#layer-top)" />
  <rect x="86" y="112" width="340" height="16" rx="8" fill="#ffffff" fill-opacity="0.24" />
  <rect x="112" y="148" width="76" height="10" rx="5" fill="#78350f" fill-opacity="0.4" />
  <rect x="324" y="148" width="76" height="10" rx="5" fill="#78350f" fill-opacity="0.4" />

  <!-- Metallic Central Compression Strap -->
  <rect x="218" y="92" width="76" height="328" rx="18" fill="url(#strap-metal)" stroke="#0f172a" stroke-width="6" />
  <rect x="234" y="108" width="10" height="296" rx="5" fill="#ffffff" fill-opacity="0.35" />

  <!-- Top & Bottom Golden Buckle Clasps -->
  <rect x="206" y="128" width="100" height="28" rx="10" fill="url(#orar-border)" stroke="#0f172a" stroke-width="5" />
  <rect x="206" y="356" width="100" height="28" rx="10" fill="url(#orar-border)" stroke="#0f172a" stroke-width="5" />

  <!-- Central Medallion -->
  <circle cx="256" cy="256" r="82" fill="#0f172a" stroke="url(#orar-border)" stroke-width="10" />
  <circle cx="256" cy="256" r="66" fill="#171936" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2" />

  <!-- Luminous Geometric Signature "O" -->
  <circle cx="256" cy="256" r="38" stroke="url(#o-glow)" stroke-width="16" />
  <circle cx="256" cy="256" r="14" fill="#fbbf24" fill-opacity="0.22" />
  <path d="M226 226 A42 42 0 0 1 286 226" stroke="#fef3c7" stroke-width="4" stroke-linecap="round" stroke-opacity="0.85" />
</svg>

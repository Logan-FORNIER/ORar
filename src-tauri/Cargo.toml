[package]
name = "orar"
version = "0.1.0"
description = "ORar - Gestionnaire d'archives moderne et format de compression signature .orar"
authors = ["ORar"]
edition = "2021"

[lib]
name = "orar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2.2", default-features = false, features = ["deflate", "time"] }
flate2 = "1.0"
tar = "0.4"
crc32fast = "1.4"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", features = ["hmac"] }
hmac = "0.12"
rand = "0.8"
walkdir = "2.5"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
tempfile = "3.10"
